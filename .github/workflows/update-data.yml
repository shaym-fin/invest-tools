name: עדכון נתוני תשואות

on:
  schedule:
    - cron: "0 5 10,20 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: משיכת נתונים מ-data.gov.il
        run: python scripts/update_data.py
      - name: שמירת הנתונים באתר
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "עדכון נתוני תשואות $(date +%Y-%m-%d)"
          git push
