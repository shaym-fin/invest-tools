name: עדכון ריבית פריים

on:
  schedule:
    - cron: "30 14 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: בדיקת ריבית בנק ישראל
        run: python scripts/update_prime.py
      - name: שמירה באתר
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/prime.json
          git diff --cached --quiet || git commit -m "עדכון ריבית פריים $(date +%Y-%m-%d)"
          git pull --rebase
          git push
